### model
model_name_or_path: Qwen/Qwen2.5-Omni-7B
trust_remote_code: true
#resume_from_checkpoint: saves/qwen3-4b/lora/sft-stateful-test/checkpoint-60
resume_from_checkpoint: null
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
flash_attn: fa3
ddp_find_unused_parameters: false

### dataset
dataset: identity,alpaca_en_demo
template: qwen2_omni
cutoff_len: 2048
max_steps: 80
preprocessing_num_workers: 4
dataloader_num_workers: 2
use_stateful_dataloader: true
streaming: true
mix_strategy: interleave_over
interleave_probs: 0.5,0.5

### output
#output_dir: saves/qwen3-4b/lora/sft-stateful-resume
output_dir: saves/qwen3-4b/lora/sft-stateful-test
logging_steps: 10
save_steps: 60
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
seed: 42
full_determinism: true
### eval
eval_dataset: identity, identity, identity
eval_interleave_probs: 0.3, 0.3, 0.4
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 10

accelerator_config:
  dispatch_batches: false
  
