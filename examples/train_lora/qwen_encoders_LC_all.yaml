### model
model_name_or_path: Qwen/Qwen2.5-Omni-7B
resume_from_checkpoint: null
trust_remote_code: true
image_max_pixels: 262144    # 512×512; or 589824 for 768×768
image_min_pixels: 1024
video_max_pixels: 65536     # 256×256
video_min_pixels: 256


### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
flash_attn: fa3
ddp_find_unused_parameters: false

### dataset
# Native Qwen placeholders only (<image>/<video>/<audio>). Do not use lipread/medgemma/terramind columns.
# aya             -> aya_train                    (text)
# lipcrops        -> lipcrops_180hours_omni_train (videos, <video>)
# lnqa            -> lnqa_train                   (images, <image>)
# speech2latex    -> sentences + equations trains (audios, <audio>)
dataset_info: data/dataset_info.json
dataset: aya_train,lipcrops_180hours_omni_train,lnqa_train,speech2latex_sentences_train,speech2latex_equations_train
template: qwen2_omni
cutoff_len: 2048
packing: false
max_steps: 50000
preprocessing_num_workers: 4
use_stateful_dataloader: true
buffer_size: 128
preprocessing_batch_size: 128
streaming: true
# concat does not mix sources in streaming mode
mix_strategy: interleave_over
dataloader_num_workers: 4
dataloader_prefetch_factor: 12
dataloader_pin_memory: true
dataloader_persistent_workers: true

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/LlamaFactory/saves/qwen25omni_lora_16_encoders_LC_all
logging_steps: 10
save_total_limit: 3
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
# Export WANDB_PROJECT and WANDB_API_KEY in the job environment.
report_to: wandb
run_name: qwen25omni_lora_LC_all_rank16

### train
disable_gradient_checkpointing: false
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
seed: 42
full_determinism: false
regional_compile: true
regional_compile_dynamic: true
regional_compile_backend: inductor
regional_compile_mode: null
regional_compile_exclude: visual,vision_tower,vision_model,audio_tower,image_encoder

### eval
eval_dataset: aya_val,lipcrops_180hours_omni_val,lnqa_val,speech2latex_sentences_test,speech2latex_equations_test
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 250
max_eval_samples: 1024

accelerator_config:
  dispatch_batches: false


# --- early stopping ---
# save_steps must be evenly divisible by eval_steps (500 % 500 == 0, so OK)
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_steps: 5   # stop if eval_loss hasn't improved for 5 consecutive evals (2500 steps of patience)
