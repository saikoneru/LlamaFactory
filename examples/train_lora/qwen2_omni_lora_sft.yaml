### model
model_name_or_path: Qwen/Qwen2.5-Omni-7B
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
#deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: train_v1  # video: mllm_video_demo
eval_dataset: dev_v1
template: qwen2_omni
cutoff_len: 8096
overwrite_cache: true
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
accelerator_config:
  dispatch_batches: false
preprocessing_num_workers: 16
### output
output_dir: /net/scratch/hscra/plgrid/plgskoneru/v1/omni_v1
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
load_best_model_at_end: true

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
#resume_from_checkpoint: /net/scratch/hscra/plgrid/plgskoneru/v1/omni_v1/checkpoint-6000 
save_total_limit: 3
max_steps: 30000
report_to: wandb
run_name: v1_omni 
auto_find_batch_size: true

## eval
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 2000
