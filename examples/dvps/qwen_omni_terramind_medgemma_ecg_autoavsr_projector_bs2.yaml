### Projector-only SFT on qwen_omni_terramind_medgemma_ecg_autoavsr.
### Same run as qwen_omni_terramind_medgemma_ecg_autoavsr_projector.yaml
### with per-device batch 2 and accumulation 4. Effective batch stays 32
### (2 x 4 x 4 GPUs). Thinker and every encoder stay frozen.
### Each dataset uses one encoder family, so some projectors are idle
### on a given step (ddp_find_unused_parameters).
# wandb_entity: DVPS-ai
# wandb_project: dvps-fm
# Submit with:
#   sbatch --job-name=four_proj_bs2 examples/dvps/run_train.sbatch <this yaml> dvps-fm
###
###   benx_s1s2_train                                        <terramind> S1GRD + S2L2A
###   ecg_instruct_ptbxl_medgemma_train                      <medgemma>
###   ecg_qa_ptbxl_paraphrased_medgemma_train                <medgemma>
###   ecg_qa_mimic_iv_ecg_paraphrased_medgemma_train         <medgemma>
###   ecg_instruct_mimic_medgemma_train                      <medgemma>
###   mmtrain_lipcrops_autoavsr_video_train                  <autoavsr_video>

### model
model_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/checkpoints/qwen_omni_terramind_medgemma_ecg_autoavsr
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 0
freeze_trainable_modules: all
freeze_vision_tower: true
freeze_language_model: true
freeze_multi_modal_projector: false

### dataset
dataset: benx_s1s2_train, ecg_instruct_ptbxl_medgemma_train, ecg_qa_ptbxl_paraphrased_medgemma_train, ecg_qa_mimic_iv_ecg_paraphrased_medgemma_train, ecg_instruct_mimic_medgemma_train, mmtrain_lipcrops_autoavsr_video_train 
mix_strategy: interleave_over
interleave_probs: 0.333333, 0.0825, 0.0825, 0.0825, 0.0825, 0.333333
eval_dataset: benx_s1s2_val, ecg_instruct_ptbxl_medgemma_val_fixed, ecg_qa_ptbxl_paraphrased_medgemma_valid_fixed, ecg_qa_mimic_iv_ecg_paraphrased_medgemma_valid_fixed, ecg_instruct_mimic_medgemma_val_fixed, mmtrain_lipcrops_autoavsr_video_val
eval_interleave_probs: 0.333333, 0.0825, 0.0825, 0.0825, 0.0825, 0.333333
eval_on_each_dataset: true
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: true
use_stateful_dataloader: true
max_steps: 100000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/qwen_omni_terramind_medgemma_ecg_autoavsr_projector_bs2_resumable
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: qwen-omni-terramind-medgemma-ecg-autoavsr-projector-bs2-resumable

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
ddp_find_unused_parameters: true
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
max_eval_samples: 1024
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
# eval_loss is the mean of the per-dataset validation losses, weighted by
# eval_interleave_probs (same weights as training).
# Stop after 5 evals (5 x 500 steps) with no improvement.
early_stopping_steps: 8
