### MedGemma ECGInstruct vision tower + Qwen2.5-Omni-7B.
### Projector only. The Thinker and the vision tower stay frozen.
# wandb_entity: DVPS-ai
# wandb_project: CD-finetuning
# Submit with: sbatch --mem=180G LLaMA-Factory/examples/dvps/run_train.sbatch <this yaml>
### Equal mix of the four multimodal ECG train sets.
###
###   ecg_instruct_ptbxl_medgemma_train
###   ecg_qa_ptbxl_paraphrased_medgemma_train
###   ecg_qa_mimic_iv_ecg_paraphrased_medgemma_train
###   ecg_instruct_mimic_medgemma_train

### model
model_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/checkpoints/qwen_omni_medgemma_ecginstruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 0
freeze_trainable_modules: all
freeze_vision_tower: true
freeze_language_model: true
freeze_multi_modal_projector: false

### dataset
dataset: ecg_instruct_ptbxl_medgemma_train, ecg_qa_ptbxl_paraphrased_medgemma_train, ecg_qa_mimic_iv_ecg_paraphrased_medgemma_train, ecg_instruct_mimic_medgemma_train
mix_strategy: interleave_over
interleave_probs: 0.25, 0.25, 0.25, 0.25
eval_dataset: ecg_instruct_ptbxl_medgemma_val, ecg_qa_ptbxl_paraphrased_medgemma_valid, ecg_qa_mimic_iv_ecg_paraphrased_medgemma_valid, ecg_instruct_mimic_medgemma_val
eval_on_each_dataset: true
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: true
max_steps: 60000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/medgemma_ecginstruct_4ecg_projector
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: medgemma-ecg-projector

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
max_eval_samples: 2048
