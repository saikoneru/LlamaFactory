### Native Qwen2.5-Omni thinker LoRA on lipcrops video only at 10 fps.
# wandb_entity: DVPS-ai
# wandb_project: LC-finetuning
### Keeps each full lip crop inside cutoff_len. The 2 fps run stays separate.

### model
model_name_or_path: Qwen/Qwen2.5-Omni-7B
image_max_pixels: 262144
video_max_pixels: 16384
video_fps: 10.0
video_maxlen: 200
use_audio_in_video: false
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
flash_attn: fa3
ddp_find_unused_parameters: false
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false

### dataset
dataset_info: data/dataset_info.json
dataset: lipcrops_180hours_omni_train
eval_dataset: lipcrops_180hours_omni_val
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
mix_strategy: interleave_over
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 4
use_stateful_dataloader: true
dataloader_num_workers: 4
dataloader_prefetch_factor: 12
dataloader_pin_memory: true
dataloader_persistent_workers: true
dataloader_drop_last: true
max_steps: 50000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/qwen25_omni_lipcrops_video_10fps
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: lipcrops-qwen2.5-omni-video-only-10fps

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
max_eval_samples: 1024
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_steps: 5
