### Projector-only VSR SFT with frozen Auto-AVSR video Conformer.
# wandb_entity: DVPS-ai
# wandb_project: LC-finetuning
### The derived dataset contains no audio marker or audio payload.

### model
model_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/checkpoints/qwen_omni_autoavsr_video
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 0
freeze_trainable_modules: all
freeze_vision_tower: true
freeze_language_model: true
freeze_multi_modal_projector: false

### dataset
dataset: mmtrain_lipcrops_autoavsr_video_train
eval_dataset: mmtrain_lipcrops_autoavsr_video_val
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: true
max_steps: 60000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/autoavsr_video
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: lipcrops-autoavsr-video-projectors-only

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
max_eval_samples: 1024
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_steps: 5
