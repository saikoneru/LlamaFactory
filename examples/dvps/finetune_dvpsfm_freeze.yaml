### model

model_name_or_path: Qwen/Qwen2.5-Omni-7B
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true


### method

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
freeze_vision_tower: true


### dataset

dataset: mimic_cxr_train, bentxt_train, simple_train_v1,st_train_v1,asr_train_v1,speech2latex_equations_train,speech2latex_sentences_train
#dataset: simple_train_v1,st_train_v1,asr_train_v1,speech2latex_equations_train,speech2latex_sentences_train


dataset_dir: /net/storage/pr3/plgrid/plggdvps/datasets

template: qwen2_omni
cutoff_len: 2048
overwrite_cache: true

mix_strategy: interleave_over
interleave_probs: 0.40, 0.30, 0.06,0.06,0.06,0.06,0.06
#interleave_probs: 0.76,0.06,0.06,0.06,0.06


# --- streaming ---

streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 16
dataloader_num_workers: 1

max_steps: 60000

accelerator_config:
  dispatch_batches: false


### output

output_dir: /net/storage/pr3/plgrid/plggdvps/skoneru/dvps_fm/qwen_omni2.5_freeze

logging_steps: 10

save_strategy: steps
save_steps: 500
save_total_limit: 3

plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: qwen2_omni-7b-freezemodalencoder-all


### train

per_device_train_batch_size: 16
gradient_accumulation_steps: 2

learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1

bf16: true
ddp_timeout: 180000000

resume_from_checkpoint: null


### eval
#eval_dataset: mimic_cxr_validation,simple_dev_v1,st_dev_v1,asr_dev_v1,speech2latex_equations_test,speech2latex_sentences_test
eval_dataset: mimic_cxr_validation, bentxt_val, simple_dev_v1,st_dev_v1,asr_dev_v1,speech2latex_equations_test,speech2latex_sentences_test

per_device_eval_batch_size: 32
eval_strategy: steps
eval_steps: 500


# --- early stopping / best checkpoint ---

load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

# 5 evals x 500 steps = 2500 steps without improvement before stopping
early_stopping_steps: 5
