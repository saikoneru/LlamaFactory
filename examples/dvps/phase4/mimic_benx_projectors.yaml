### Mixed MIMIC-CXR (MedGemma) + BigEarthNet.txt (TerraMind S1+S2 + Omni RGB).
### Dual-encoder checkpoint so both projectors train in one loop.
###
### Change datasets here (comma-separated names). Names and parquet paths live in
###   LLaMA-Factory/data/dataset_info.json
###   mimic_cxr_medgemma_*  -> MIMIC MedGemma view (<medgemma> prompts)
###   benx_terramindl2_omnirgb_* -> BEN S1GRD+S2L2A + RGB (do NOT use benx_terramindl2_*)
### Mix weights: mix_strategy + interleave_probs (must match the dataset count).
### model
model_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/checkpoints/qwen_omni_terramind_medgemma
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 0
freeze_trainable_modules: all
freeze_vision_tower: true
freeze_language_model: true
freeze_multi_modal_projector: false

### dataset
dataset: mimic_cxr_medgemma_train, benx_terramindl2_omnirgb_train
mix_strategy: interleave_over
interleave_probs: 0.5, 0.5
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: true
max_steps: 60000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/phase4/mimic_benx_projectors
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: phase4-mimic-benx-projectors

### train
# Mixed 896 MedGemma + BEN RGB + TerraMind; start at 1 per GPU.
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
ddp_find_unused_parameters: true
resume_from_checkpoint: null

### eval
eval_dataset: mimic_cxr_medgemma_validation, benx_terramindl2_omnirgb_val
eval_on_each_dataset: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
# save_steps is already 500, so eval and checkpoint stay aligned.
