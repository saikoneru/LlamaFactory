### Phase 4 control: MIMIC-CXR as native Omni RGB (copy of finetune_dvpsfm_mimic.yaml, new output dir).
### model
model_name_or_path: Qwen/Qwen2.5-Omni-7B
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
freeze_vision_tower: true

### dataset
dataset: mimic_cxr_train
eval_dataset: mimic_cxr_validation
dataset_dir: /net/storage/pr3/plgrid/plggdvps/datasets
template: qwen2_omni
cutoff_len: 2048
overwrite_cache: true
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 16
dataloader_num_workers: 1
dataloader_drop_last: true
max_steps: 60000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/phase4/mimic_omnirgb_lora
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: phase4-mimic-omnirgb-lora

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 32
eval_strategy: steps
eval_steps: 500
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_steps: 5
