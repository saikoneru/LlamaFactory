### Phase 4 control: MIMIC-CXR as native Omni RGB (copy of finetune_dvpsfm_mimic.yaml, new output dir).
### model
model_name_or_path: Qwen/Qwen2.5-Omni-7B
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
freeze_vision_tower: true

### dataset
dataset: ecg_instruct_ptbxl_train, ecg_instruct_mimic_train, ecg_qa_ptbxl_paraphrased_train, ecg_qa_mimic_iv_ecg_paraphrased_train
eval_dataset: ecg_instruct_mimic_val, ecg_instruct_ptbxl_val, ecg_qa_mimic_iv_ecg_paraphrased_valid, ecg_qa_ptbxl_paraphrased_valid
mix_strategy: interleave_over
interleave_probs: [0.25, 0.25, 0.25, 0.25]
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
template: qwen2_omni
cutoff_len: 2048
overwrite_cache: true
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 16
dataloader_num_workers: 1
dataloader_drop_last: true
max_steps: 100000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/qwen25omni_lora_16_encoders_CD_subset
logging_steps: 10
save_strategy: steps
save_steps: 250
save_total_limit: 3
plot_loss: true
# false so a restart keeps checkpoint-* and LlamaFactory resumes instead of wiping output_dir
overwrite_output_dir: false
save_only_model: false
report_to: wandb
run_name: qwen25omni_lora_CD_ecg_only_rank16

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
# Last complete save before the job died at step 9000 while reloading the best checkpoint.
resume_from_checkpoint: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/qwen25omni_lora_16_encoders_CD_subset/checkpoint-9000

### eval
eval_on_each_dataset: false
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 250
max_eval_samples: 2048
# Reloading the best checkpoint at the end OOM'd on GPU (checkpoint-7750, eval loss 0.385).
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_steps: 5