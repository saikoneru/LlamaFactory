### Generate MIMIC-CXR reports from the Omni RGB control.
### model
model_name_or_path: Qwen/Qwen2.5-Omni-7B
adapter_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/phase4/mimic_omnirgb_lora
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: false
do_predict: true
finetuning_type: lora

### dataset
eval_dataset: mimic_cxr_test
dataset_dir: /net/storage/pr3/plgrid/plggdvps/datasets
template: qwen2_omni
cutoff_len: 2048
overwrite_cache: true
max_samples: 64
preprocessing_num_workers: 16
dataloader_num_workers: 0

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/phase4/mimic_omnirgb_lora_predict
overwrite_output_dir: true
report_to: none

### eval
per_device_eval_batch_size: 1
predict_with_generate: true
ddp_timeout: 180000000
do_sample: false
max_new_tokens: 512
