### Same mixed MIMIC+BEN projector train as mimic_benx_projectors.yaml,
### but a 2-GPU / 1-hour slot (separate output dir so it cannot clobber the 4-GPU job).
### model
model_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/checkpoints/qwen_omni_terramind_medgemma
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 0
freeze_trainable_modules: all
freeze_vision_tower: true
freeze_language_model: true
freeze_multi_modal_projector: false

### dataset
dataset: mimic_cxr_medgemma_train, benx_terramindl2_omnirgb_train
mix_strategy: interleave_over
interleave_probs: 0.5, 0.5
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: true
max_steps: 60000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/phase4/mimic_benx_projectors_2gpu_1h
logging_steps: 10
save_strategy: steps
save_steps: 50
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: phase4-mimic-benx-projectors-2gpu-1h

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
ddp_find_unused_parameters: true
resume_from_checkpoint: null

### eval
eval_strategy: "no"
