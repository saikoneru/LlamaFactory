### Phase 4: BEN S2L2A-only with masked S1GRD, projector-only.
### Qwen Thinker and the mask-capable TerraMind backbone stay frozen.
### model
model_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/checkpoints/qwen_omni_terramind_s1s2
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 0
freeze_trainable_modules: all
freeze_vision_tower: true
freeze_language_model: true
freeze_multi_modal_projector: false

### dataset
dataset: mmtrain_bentxt_terramind_train
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: true
max_steps: 60000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/outputs/phase4/qwen25omni-benx-terramind-only-projector-evalsize
logging_steps: 10
save_strategy: steps
save_steps: 250
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: qwen25omni-benx-terramind-only-projector-evalsize

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_dataset: mmtrain_bentxt_terramind_val
per_device_eval_batch_size: 16
eval_strategy: steps
eval_steps: 250
max_eval_samples: 250

## early stopping
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_steps: 5
