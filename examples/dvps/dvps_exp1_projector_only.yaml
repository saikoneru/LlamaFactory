### model
model_name_or_path: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/checkpoints/qwen_omni_terramind_medgemma_ecg_autoavsr
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 0
freeze_trainable_modules: all
freeze_vision_tower: true
freeze_language_model: true
freeze_multi_modal_projector: false

dataset: benx_s1s2_train, acdc_medgemma_train, mnm2_medgemma_train, emidec_medgemma_train, ecg_instruct_ptbxl_medgemma_train, ecg_qa_ptbxl_paraphrased_medgemma_train, ecg_qa_mimic_iv_ecg_paraphrased_medgemma_train, ecg_instruct_mimic_medgemma_train, mmtrain_lipcrops_autoavsr_video_train 
mix_strategy: interleave_over
interleave_probs: 0.25, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.25
eval_dataset: benx_s1s2_val, acdc_medgemma_val, mnm2_medgemma_val, emidec_medgemma_val, ecg_instruct_ptbxl_medgemma_val_fixed, ecg_qa_ptbxl_paraphrased_medgemma_valid_fixed, ecg_qa_mimic_iv_ecg_paraphrased_medgemma_valid_fixed, ecg_instruct_mimic_medgemma_val_fixed, mmtrain_lipcrops_autoavsr_video_val
eval_interleave_probs: 0.25, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.0714286, 0.25
eval_on_each_dataset: true
template: qwen2_omni
cutoff_len: 2048
dataset_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/LLaMA-Factory/data
overwrite_cache: true
packing: false
streaming: true
buffer_size: 128
preprocessing_batch_size: 128
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: true
use_stateful_dataloader: true
max_steps: 100000
accelerator_config:
  dispatch_batches: false

### output
output_dir: /net/storage/pr3/plgrid/plggdvps/rcorrente/dvps-fm/dvps-fm-v1-ablations/dvps_exp1_projector_only
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: wandb
run_name: dvps-exp1-projector-only-lr-1e-4

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
