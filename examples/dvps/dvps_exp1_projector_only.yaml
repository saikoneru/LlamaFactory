###     0.04  mmtrain_lipcrops_autoavsr_av_train                <autoavsr_audio> + <autoavsr_video>
###     0.04  AMI                                               not registered, skipped
###     0.10  audio_flan_slu_train                              native <audio>
###     0.07  speech2latex_{sentences,equations}_train          native <audio>, 0.035 each
###   Cardiology (0.32)
###     0.12  ecg_qa_{ptbxl,mimic_iv_ecg}_paraphrased_medgemma  <medgemma>, 0.06 each
###     0.09  ecg_instruct_{ptbxl,mimic}_medgemma_train         <medgemma>, 0.045 each
